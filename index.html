<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Уведомление об оплате</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f4f5f6;
    font-family: "Roboto", Arial, sans-serif;
    color: #444;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

body {
    overflow-x: hidden;
}

button {
    font-family: "Roboto", Arial, sans-serif;
}

/* =========================
   ОСНОВНОЙ КОНТЕЙНЕР
========================= */

.ticket {
    width: 100%;
    min-height: 100vh;
    background: #f4f5f6;
}

/* =========================
   ВЕРХНИЙ СИНИЙ БЛОК
========================= */

.header {
    position: relative;
    width: 100%;
    height: 162px;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding-bottom: 22px;

    overflow: hidden;

    background: #4a99ed;
}

/* верхняя тёмная дуга */

.header::before {
    content: "";

    position: absolute;

    width: 370px;
    height: 120px;

    top: -72px;
    left: 50%;

    transform: translateX(-50%);

    background: #2865aa;

    border-radius: 50%;
}

/* заголовок */

.header-title {
    position: relative;
    z-index: 2;

    color: #ffffff;

    font-size: 20px;
    line-height: 1;

    font-weight: 300;

    white-space: nowrap;

    letter-spacing: 0;
}

.header-title::before {
    content: "—";
    margin-right: 7px;
}

.header-title::after {
    content: "—";
    margin-left: 7px;
}


/* =========================
   ДЕКОРАТИВНАЯ ВОЛНА
========================= */

.wave {
    position: relative;

    width: 100%;
    height: 54px;

    overflow: hidden;

    margin-top: -1px;
}

.wave::before {
    content: "";

    position: absolute;

    width: 125%;
    height: 67px;

    left: -12.5%;
    top: -25px;

    background: #c8e9ea;

    border-radius:
        50% 50% 0 0 /
        42% 42% 0 0;
}

.wave::after {
    content: "";

    position: absolute;

    width: 125%;
    height: 43px;

    left: -12.5%;
    top: -2px;

    background: #f4f5f6;

    border-radius:
        50% 50% 0 0 /
        55% 55% 0 0;
}


/* =========================
   ОСНОВНОЙ КОНТЕНТ
========================= */

.content {
    width: 100%;

    padding:
        0
        18px
        40px;

    text-align: center;
}


/* =========================
   УСПЕШНАЯ ОПЛАТА
========================= */

.success {
    margin: 0;

    font-size: 18px;
    line-height: 1.3;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   ТРАМВАЙ
========================= */

.route {
    margin-top: 55px;

    font-size: 20px;
    line-height: 1.15;

    font-weight: 700;

    letter-spacing: 0;
}


/* =========================
   ЦЕНА
========================= */

.price {
    margin-top: 10px;

    font-size: 48px;
    line-height: 1;

    font-weight: 700;

    letter-spacing: -1px;
}

.price span {
    font-size: 48px;

    font-weight: 400;

    letter-spacing: -1px;
}


/* =========================
   ДАТА
========================= */

.date {
    margin-top: 38px;

    font-size: 18px;
    line-height: 1.2;

    font-weight: 400;

    letter-spacing: 0;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   Т/С
========================= */

.ticket-code {
    margin-top: 7px;

    font-size: 18px;
    line-height: 1.2;

    font-weight: 400;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;
}

.ticket-code strong {
    font-weight: 400;
}


/* =========================
   ТАЙМЕР — ЗАГОЛОВОК
========================= */

.timer-title {
    margin-top: 48px;

    font-size: 18px;
    line-height: 1.3;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   ТАЙМЕР
========================= */

.timer {
    margin-top: 3px;

    font-size: 32px;
    line-height: 1;

    font-weight: 700;

    letter-spacing: -0.5px;

    font-variant-numeric: tabular-nums;
}


/* =========================
   QR
========================= */

.qr-wrapper {
    width: 360px;
    height: 360px;

    margin: 31px auto 0;

    background: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#qrcode {
    width: 360px;
    height: 360px;

    display: flex;
    align-items: center;
    justify-content: center;
}

#qrcode img,
#qrcode canvas {
    width: 360px !important;
    height: 360px !important;

    display: block;
}


/* =========================
   СЕРИЯ И НОМЕР
========================= */

.info {
    margin-top: 42px;

    font-size: 18px;
    line-height: 1.55;

    font-weight: 400;

    letter-spacing: 0;
}

.info strong {
    font-weight: 700;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction {
    margin: 47px auto 0;

    max-width: 390px;

    font-size: 18px;
    line-height: 1.48;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   КНОПКА
========================= */

.download {
    display: block;

    width: 100%;
    height: 76px;

    margin: 49px auto 0;

    padding: 0;

    border: none;
    border-radius: 28px;

    background:
        linear-gradient(
            180deg,
            #58c8d1 0%,
            #4799ee 100%
        );

    color: #ffffff;

    font-size: 25px;
    line-height: 1;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 28px
        rgba(60,130,190,0.16);

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.download:active {
    transform: scale(.985);

    box-shadow:
        0 5px 15px
        rgba(60,130,190,.12);
}


/* =========================
   ДОМЕН
========================= */

.domain {
    display: inline-block;

    margin-top: 15px;

    padding:
        10px
        23px;

    border-radius: 30px;

    background: #ffffff;

    color: #222;

    font-size: 16px;
    line-height: 1;

    font-weight: 400;

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.05);
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 601px) {

    .content {
        max-width: 520px;
        margin: 0 auto;
    }

}


/* =========================
   МАЛЕНЬКИЕ ЭКРАНЫ
========================= */

@media (max-width: 390px) {

    .header-title {
        font-size: 18px;
    }

    .success {
        font-size: 17px;
    }

    .route {
        font-size: 19px;
    }

    .price,
    .price span {
        font-size: 44px;
    }

    .date,
    .ticket-code,
    .timer-title,
    .info,
    .instruction {
        font-size: 17px;
    }

    .timer {
        font-size: 30px;
    }

    .qr-wrapper {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    #qrcode {
        width: 100%;
        height: 100%;
    }

    #qrcode img,
    #qrcode canvas {
        width: 100% !important;
        height: 100% !important;
    }

}

</style>
</head>


<body>

<div class="ticket">

    <!-- HEADER -->

    <header class="header">

        <div class="header-title">
            Уведомление об оплате
        </div>

    </header>


    <!-- WAVE -->

    <div class="wave"></div>


    <!-- CONTENT -->

    <main class="content">


        <!-- SUCCESS -->

        <div class="success">
            Ваш проезд успешно оплачен!
        </div>


        <!-- ROUTE -->

        <div class="route">
            Трамвай: №3
        </div>


        <!-- PRICE -->

        <div class="price">
            42 <span>₽</span>
        </div>


        <!-- DATE -->

        <div
            class="date"
            id="paymentDate"
            title="Нажмите для изменения"
        >
            Загрузка...
        </div>


        <!-- VEHICLE -->

        <div
            class="ticket-code"
            id="vehicle"
            title="Нажмите для изменения"
        >
            Т/С: <strong>734</strong>
        </div>


        <!-- TIMER TITLE -->

        <div class="timer-title">
            С момента оплаты прошло:
        </div>


        <!-- TIMER -->

        <div
            class="timer"
            id="timer"
        >
            00:00
        </div>


        <!-- QR -->

        <div class="qr-wrapper">

            <div id="qrcode"></div>

        </div>


        <!-- TICKET DATA -->

        <div class="info">

            Серия билета:
            <strong id="ticketSeries">
                QR200938000636
            </strong>

            <br>

            Номер билета:
            <strong id="ticketNumber">
                20260901173500141
            </strong>

        </div>


        <!-- INSTRUCTION -->

        <div class="instruction">

            Предъявите контролеру QR-код.<br>

            Чтобы сохранить реквизиты билета,
            нажмите кнопку «Скачать»

        </div>


        <!-- DOWNLOAD -->

        <button
            class="download"
            id="downloadButton"
        >
            Скачать билет
        </button>


        <!-- DOMAIN -->

        


    </main>

</div>


<script>

/* =========================
   ДАННЫЕ
========================= */

let vehicle =
    localStorage.getItem("ticketVehicle") || "734";

const ticketSeries =
    "QR200938000636";

const ticketNumber =
    "20260901173500141";


/* =========================
   ДАТА ОПЛАТЫ
========================= */

let paymentDate = new Date();


/* =========================
   ФОРМАТ ДАТЫ
========================= */

function formatDate(date) {

    const day =
        String(date.getDate()).padStart(2, "0");

    const month =
        String(date.getMonth() + 1).padStart(2, "0");

    const year =
        date.getFullYear();

    const hours =
        String(date.getHours()).padStart(2, "0");

    const minutes =
        String(date.getMinutes()).padStart(2, "0");

    return (
        day +
        "." +
        month +
        "." +
        year +
        " " +
        hours +
        ":" +
        minutes
    );
}


/* =========================
   QR ДАТА
========================= */

function formatQRDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(date.getDate())
        .padStart(2, "0");

    const hours =
        String(date.getHours())
        .padStart(2, "0");

    const minutes =
        String(date.getMinutes())
        .padStart(2, "0");

    const seconds =
        String(date.getSeconds())
        .padStart(2, "0");

    return (
        year +
        month +
        day +
        "T" +
        hours +
        minutes +
        seconds
    );
}


/* =========================
   ОБНОВЛЕНИЕ ДАТЫ
========================= */

function updateDateDisplay() {

    document.getElementById(
        "paymentDate"
    ).textContent =
        formatDate(paymentDate);

}


/* =========================
   ОБНОВЛЕНИЕ Т/С
========================= */

function updateVehicleDisplay() {

    document.getElementById(
        "vehicle"
    ).innerHTML =
        "Т/С: <strong>" +
        vehicle +
        "</strong>";

}


/* =========================
   СОЗДАНИЕ QR
========================= */

function generateQR() {

    const qrContainer =
        document.getElementById("qrcode");

    qrContainer.innerHTML = "";

    const qrData =
        "DEMO-TICKET" +
        ";SERIES=" +
        ticketSeries +
        ";NUMBER=" +
        ticketNumber +
        ";DATE=" +
        formatQRDate(paymentDate) +
        ";ROUTE=3" +
        ";AMOUNT=42" +
        ";VEHICLE=" +
        vehicle;

    if (typeof QRCode !== "undefined") {
        new QRCode(qrContainer, {
            text: qrData,
            width: 360,
            height: 360,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
        return;
    }

    // Резервный вариант, если CDN библиотеки QR недоступен.
    const img = document.createElement("img");
    img.alt = "QR-код";
    img.width = 360;
    img.height = 360;
    img.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=0&data=" +
        encodeURIComponent(qrData);
    qrContainer.appendChild(img);

}


/* =========================
   ФОРМАТ ТАЙМЕРА
========================= */

function formatTimer(totalSeconds) {

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    if (hours === 0) {

        return (
            String(minutes)
                .padStart(2, "0") +
            ":" +
            String(seconds)
                .padStart(2, "0")
        );

    }


    return (
        String(hours)
            .padStart(2, "0") +
        ":" +
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(seconds)
            .padStart(2, "0")
    );

}


/* =========================
   ОБНОВЛЕНИЕ ТАЙМЕРА
========================= */

const TIMER_START_KEY = "ticketTimerStartTime";
const TIMER_OFFSET_KEY = "ticketTimerDisplayOffset";

let timerStartTime = Number(localStorage.getItem(TIMER_START_KEY));
let timerDisplayOffset = Number(localStorage.getItem(TIMER_OFFSET_KEY));

if (!Number.isFinite(timerStartTime) || timerStartTime <= 0) {
    timerStartTime = Date.now();
    timerDisplayOffset = 0;
    localStorage.setItem(TIMER_START_KEY, String(timerStartTime));
    localStorage.setItem(TIMER_OFFSET_KEY, String(timerDisplayOffset));
}

if (!Number.isFinite(timerDisplayOffset) || timerDisplayOffset < 0) {
    timerDisplayOffset = 0;
    localStorage.setItem(TIMER_OFFSET_KEY, "0");
}

function formatTimer(totalSeconds) {
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    if (hours > 0) {
        return String(hours).padStart(2, "0") + ":" +
               String(minutes).padStart(2, "0") + ":" +
               String(seconds).padStart(2, "0");
    }

    return String(minutes).padStart(2, "0") + ":" +
           String(seconds).padStart(2, "0");
}

function updateTimer() {
    // Таймер считается от сохранённого момента старта.
    // Поэтому обновление страницы его НЕ сбрасывает.
    const elapsedSeconds = Math.max(
        0,
        Math.floor((Date.now() - timerStartTime) / 1000)
    );

    document.getElementById("timer").textContent =
        formatTimer(timerDisplayOffset + elapsedSeconds);
}

function resetTimerAfterDownload() {
    // Единственное действие, которое сбрасывает таймер.
    timerDisplayOffset =
        15 + Math.floor(Math.random() * 27);

    timerStartTime = Date.now();

    localStorage.setItem(
        TIMER_START_KEY,
        String(timerStartTime)
    );

    localStorage.setItem(
        TIMER_OFFSET_KEY,
        String(timerDisplayOffset)
    );

    updateTimer();
}

updateTimer();

/* =========================
   РЕДАКТИРОВАНИЕ ДАТЫ
========================= */

document
    .getElementById("paymentDate")
    .addEventListener(
        "click",
        function () {

            const current =
                formatDate(paymentDate);


            const value =
                prompt(
                    "Введите дату и время оплаты:\n\n" +
                    "Формат: ДД.ММ.ГГГГ ЧЧ:ММ",
                    current
                );


            if (value === null) {
                return;
            }


            const match =
                value.match(
                    /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/
                );


            if (!match) {

                alert(
                    "Неверный формат.\n\n" +
                    "Например:\n" +
                    "02.09.2026 11:04"
                );

                return;
            }


            const day =
                Number(match[1]);

            const month =
                Number(match[2]) - 1;

            const year =
                Number(match[3]);

            const hours =
                Number(match[4]);

            const minutes =
                Number(match[5]);


            const newDate =
                new Date(
                    year,
                    month,
                    day,
                    hours,
                    minutes,
                    0
                );


            if (
                newDate.getFullYear() !== year ||
                newDate.getMonth() !== month ||
                newDate.getDate() !== day ||
                newDate.getHours() !== hours ||
                newDate.getMinutes() !== minutes
            ) {

                alert(
                    "Такой даты не существует."
                );

                return;
            }


            paymentDate = newDate;

            updateDateDisplay();

            updateTimer();

            generateQR();

        }
    );


/* =========================
   РЕДАКТИРОВАНИЕ Т/С
========================= */

document
    .getElementById("vehicle")
    .addEventListener(
        "click",
        function () {

            const newVehicle =
                prompt(
                    "Введите номер Т/С:",
                    vehicle
                );


            if (newVehicle === null) {
                return;
            }


            const clean =
                newVehicle.trim();


            if (!clean) {

                alert(
                    "Номер Т/С не может быть пустым."
                );

                return;
            }


            vehicle = clean;


            localStorage.setItem(
                "ticketVehicle",
                vehicle
            );


            updateVehicleDisplay();

            generateQR();

        }
    );


/* =========================
   КНОПКА
========================= */

document
    .getElementById("downloadButton")
    .addEventListener(
        "click",
        function () {

            /*
               При нажатии таймер
               начинается заново.
            */

            paymentDate = new Date();

            // Только кнопка «Скачать билет» сбрасывает таймер.
            resetTimerAfterDownload();

            updateDateDisplay();

            generateQR();


            if (navigator.vibrate) {

                navigator.vibrate(20);

            }

        }
    );


/* =========================
   ЗАПУСК
========================= */

updateDateDisplay();

updateVehicleDisplay();

updateTimer();

generateQR();

// Автоматически обновляем отображение каждую секунду без перезагрузки.
setInterval(updateTimer, 1000);


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уведомление об оплате</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
}

body {
    display: flex;
    justify-content: center;
    padding: 30px 15px;
}

/* =========================
   TICKET
========================= */

.ticket {
    width: 430px;
    max-width: 100%;
    background: #f2f3f4;
    border-radius: 34px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0,0,0,.15);
}

/* =========================
   HEADER
========================= */

.header {
    position: relative;
    height: 89px;
    background: #209df7;
    overflow: hidden;
}

.header-shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.header-title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 15px;

    text-align: center;

    color: #fff;
    font-size: 20px;
    font-weight: 700;

    z-index: 2;
}

/* =========================
   WAVE
========================= */

.wave {
    height: 35px;
    position: relative;
    overflow: hidden;
    background: #f2f3f4;
}

.wave-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
}

/* =========================
   CONTENT
========================= */

.content {
    padding: 4px 35px 35px;
    text-align: center;
}

.success {
    margin: 0 0 10px;
    font-size: 21px;
    font-weight: 400;
}

.route {
    margin-top: 4px;

    font-size: 20px;
    line-height: 1.2;
    font-weight: 700;

    cursor: pointer;
    user-select: none;
}

.route:hover {
    opacity: .65;
}

.price {
    margin-top: 7px;

    font-size: 48px;
    line-height: 1;
    font-weight: 700;
}

.price span {
    font-size: 48px;
    font-weight: 400;
}

.date {
    margin-top: 9px;

    font-size: 18px;
    font-weight: 400;

    cursor: pointer;
    user-select: none;
}

.date:hover {
    opacity: .65;
}

.ticket-code {
    margin-top: 7px;

    font-size: 18px;
    font-weight: 400;

    cursor: pointer;
    user-select: none;
}

.ticket-code:hover {
    opacity: .65;
}

.ticket-code strong {
    font-weight: 400 !important;
    color: #111 !important;
}

/* =========================
   TIMER
========================= */

.timer-title {
    margin-top: 20px;

    font-size: 18px;
    font-weight: 400;
}

.timer {
    margin-top: 4px;

    font-size: 32px;
    line-height: 1;
    font-weight: 700;

    font-variant-numeric: tabular-nums;
}

/* =========================
   QR
========================= */

.qr-wrapper {
    width: 360px;
    height: 360px;

    max-width: 100%;

    margin: 20px auto 14px;

    background: #fff;
    border-radius: 8px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.qr-wrapper img {
    display: block;

    width: 360px;
    height: 360px;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}

/* =========================
   SERIES / NUMBER
========================= */

.info {
    font-size: 18px;
    line-height: 1.45;
    font-weight: 400;
}

.info span {
    font-weight: 700 !important;
    color: #111 !important;
    text-decoration: none !important;
    -webkit-text-fill-color: #111 !important;

    cursor: default !important;
}

/* =========================
   INSTRUCTION
========================= */

.instruction {
    margin-top: 17px;

    font-size: 17px;
    line-height: 1.35;
    font-weight: 400;
}

/* =========================
   BUTTON
========================= */

.download {
    width: 100%;
    height: 76px;

    margin-top: 22px;

    border: 0;
    border-radius: 28px;

    background: linear-gradient(
        135deg,
        #58c8d1,
        #4799ee
    );

    color: #fff;

    font-family: inherit;
    font-size: 20px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.download:hover {
    opacity: .9;
}

.download:active {
    transform: scale(.98);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        padding: 10px;
    }

    .ticket {
        border-radius: 25px;
    }

    .content {
        padding-left: 25px;
        padding-right: 25px;
    }

    .qr-wrapper {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    .qr-wrapper img {
        width: 100%;
        height: 100%;
    }

    .price,
    .price span {
        font-size: 44px;
    }
}
</style>
</head>

<body>

<div class="ticket">

    <!-- HEADER -->
    <div class="header">

        <svg
            class="header-shape"
            viewBox="0 0 430 89"
            preserveAspectRatio="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                d="
                    M 132 0
                    C 154 14, 181 24, 214 29
                    C 272 37, 349 26, 430 22
                    L 430 0
                    Z
                "
                fill="#0065B0"
            />
        </svg>

        <div class="header-title">
            — Уведомление об оплате —
        </div>

    </div>


    <!-- WAVE -->
    <div class="wave">

        <svg
            class="wave-svg"
            viewBox="0 0 430 35"
            preserveAspectRatio="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="
                    M 0 6
                    C 61 -2, 124 -7, 188 -5
                    C 274 -1, 350 5, 430 0
                    L 430 29
                    C 352 23, 274 16, 188 16
                    C 119 17, 59 24, 0 30
                    Z
                "
                fill="#BDECEE"
            />

            <path
                d="
                    M 0 30
                    C 59 24, 119 17, 188 16
                    C 274 16, 352 23, 430 29
                    L 430 35
                    L 0 35
                    Z
                "
                fill="#F2F3F4"
            />

        </svg>

    </div>


    <!-- CONTENT -->
    <div class="content">

        <p class="success">
            Проезд оплачен
        </p>


        <!-- ROUTE -->
        <div
            class="route"
            id="route"
            title="Нажмите, чтобы изменить маршрут"
        >
            Трамвай: №3
        </div>


        <!-- PRICE -->
        <div class="price">
            42<span> ₽</span>
        </div>


        <!-- DATE -->
        <div
            class="date"
            id="date"
            title="Нажмите, чтобы изменить дату"
        >
            01.09.2026 17:35
        </div>


        <!-- VEHICLE -->
        <div
            class="ticket-code"
            id="vehicleRow"
            title="Нажмите, чтобы изменить Т/С"
        >
            Т/С:
            <strong id="vehicle">734</strong>
        </div>


        <!-- TIMER -->
        <div class="timer-title">
            Время с момента оплаты
        </div>

        <div
            class="timer"
            id="timer"
        >
            00:00
        </div>


        <!-- QR -->
        <div class="qr-wrapper">
            <img
                id="qrImage"
                src=""
                alt="QR-код"
            >
        </div>


        <!-- SERIES / NUMBER -->
        <div class="info">

            Серия:
            <span id="series">
                QR260901000636
            </span>

            <br>

            Номер:
            <span id="number">
                20260901173500141
            </span>

        </div>


        <!-- INSTRUCTION -->
        <div class="instruction">
            Предъявите QR-код контролёру при проверке проезда
        </div>


        <!-- BUTTON -->
        <button
            class="download"
            id="downloadButton"
            type="button"
        >
            Скачать билет
        </button>

    </div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_PAYMENT = "ticketPaymentDate";
const STORAGE_ROUTE = "ticketRoute";
const STORAGE_VEHICLE = "ticketVehicle";

const STORAGE_SERIES = "ticketSeries";
const STORAGE_NUMBER = "ticketNumber";


/* =========================================================
   ELEMENTS
========================================================= */

const routeElement =
    document.getElementById("route");

const vehicleElement =
    document.getElementById("vehicle");

const dateElement =
    document.getElementById("date");

const timerElement =
    document.getElementById("timer");

const seriesElement =
    document.getElementById("series");

const numberElement =
    document.getElementById("number");

const qrImage =
    document.getElementById("qrImage");

const downloadButton =
    document.getElementById("downloadButton");


/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_ROUTE =
    "Трамвай: №3";

const DEFAULT_VEHICLE =
    "734";


/* =========================================================
   PAYMENT DATE
========================================================= */

let paymentDate;

const savedPayment =
    localStorage.getItem(STORAGE_PAYMENT);

if (
    savedPayment &&
    !isNaN(Number(savedPayment))
) {

    paymentDate =
        new Date(Number(savedPayment));

} else {

    paymentDate =
        new Date();

    paymentDate.setSeconds(0);
    paymentDate.setMilliseconds(0);

    localStorage.setItem(
        STORAGE_PAYMENT,
        String(paymentDate.getTime())
    );
}


/* =========================================================
   ROUTE
========================================================= */

const savedRoute =
    localStorage.getItem(STORAGE_ROUTE);

if (savedRoute) {

    routeElement.textContent =
        savedRoute;

} else {

    routeElement.textContent =
        DEFAULT_ROUTE;

    localStorage.setItem(
        STORAGE_ROUTE,
        DEFAULT_ROUTE
    );
}


/* =========================================================
   VEHICLE
========================================================= */

const savedVehicle =
    localStorage.getItem(STORAGE_VEHICLE);

if (savedVehicle) {

    vehicleElement.textContent =
        savedVehicle;

} else {

    vehicleElement.textContent =
        DEFAULT_VEHICLE;

    localStorage.setItem(
        STORAGE_VEHICLE,
        DEFAULT_VEHICLE
    );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function pad(value) {

    return String(value)
        .padStart(2, "0");

}


function formatDate(date) {

    const day =
        pad(date.getDate());

    const month =
        pad(date.getMonth() + 1);

    const year =
        date.getFullYear();

    const hours =
        pad(date.getHours());

    const minutes =
        pad(date.getMinutes());

    return (
        day +
        "." +
        month +
        "." +
        year +
        " " +
        hours +
        ":" +
        minutes
    );
}


/* =========================================================
   QR DATE
========================================================= */

function formatQRDate(date) {

    const year =
        date.getFullYear();

    const month =
        pad(date.getMonth() + 1);

    const day =
        pad(date.getDate());

    const hours =
        pad(date.getHours());

    const minutes =
        pad(date.getMinutes());

    const seconds =
        pad(date.getSeconds());

    return (
        year +
        month +
        day +
        "T" +
        hours +
        minutes +
        seconds
    );
}


/* =========================================================
   GENERATE SERIES
=========================================================

   Формат:

   QR + YYMMDD + 6 цифр

   Например:

   02.09.2026

   QR260902000636

========================================================= */

function generateSeries(date) {

    const year =
        String(date.getFullYear())
        .slice(-2);

    const month =
        pad(date.getMonth() + 1);

    const day =
        pad(date.getDate());

    let suffix =
        localStorage.getItem("ticketSeriesSuffix");

    if (!suffix) {

        suffix =
            String(
                Math.floor(
                    100000 +
                    Math.random() * 900000
                )
            );

        localStorage.setItem(
            "ticketSeriesSuffix",
            suffix
        );
    }

    return (
        "QR" +
        year +
        month +
        day +
        suffix
    );
}


/* =========================================================
   GENERATE NUMBER
=========================================================

   Формат:

   YYYYMMDDHHMMSS + 3 цифры

   Например:

   01.09.2026 17:35:00

   20260901173500141

========================================================= */

function generateNumber(date) {

    const year =
        date.getFullYear();

    const month =
        pad(date.getMonth() + 1);

    const day =
        pad(date.getDate());

    const hours =
        pad(date.getHours());

    const minutes =
        pad(date.getMinutes());

    const seconds =
        pad(date.getSeconds());

    let suffix =
        localStorage.getItem("ticketNumberSuffix");

    if (!suffix) {

        suffix =
            String(
                Math.floor(
                    100 +
                    Math.random() * 900
                )
            );

        localStorage.setItem(
            "ticketNumberSuffix",
            suffix
        );
    }

    return (
        year +
        month +
        day +
        hours +
        minutes +
        seconds +
        suffix
    );
}


/* =========================================================
   UPDATE TICKET IDENTIFIERS
========================================================= */

function updateTicketIdentifiers() {

    const series =
        generateSeries(paymentDate);

    const number =
        generateNumber(paymentDate);

    seriesElement.textContent =
        series;

    numberElement.textContent =
        number;

    localStorage.setItem(
        STORAGE_SERIES,
        series
    );

    localStorage.setItem(
        STORAGE_NUMBER,
        number
    );
}


/* =========================================================
   INITIAL IDENTIFIERS
========================================================= */

const savedSeries =
    localStorage.getItem(STORAGE_SERIES);

const savedNumber =
    localStorage.getItem(STORAGE_NUMBER);

if (savedSeries && savedNumber) {

    seriesElement.textContent =
        savedSeries;

    numberElement.textContent =
        savedNumber;

} else {

    updateTicketIdentifiers();
}


/* =========================================================
   TIMER
=========================================================

   Логика:

   Покупка в 12:40

   12:41:00 -> 01:00
   12:41:20 -> 01:40
   12:41:40 -> 01:20
   12:41:59 -> 01:01
   12:42:00 -> 02:00

========================================================= */

function updateTimer() {

    const now =
        new Date();

    const elapsed =
        now.getTime() -
        paymentDate.getTime();

    let elapsedMinutes =
        Math.floor(
            elapsed / 60000
        );

    if (elapsedMinutes < 0) {
        elapsedMinutes = 0;
    }


    let remainingSeconds =
        60 - now.getSeconds();


    if (
        remainingSeconds === 60
    ) {

        remainingSeconds = 60;
    }


    timerElement.textContent =
        pad(elapsedMinutes) +
        ":" +
        pad(remainingSeconds);
}


/* =========================================================
   DATE DISPLAY
========================================================= */

dateElement.textContent =
    formatDate(paymentDate);


/* =========================================================
   QR
========================================================= */

function generateQR() {

    const route =
        routeElement.textContent;

    const vehicle =
        vehicleElement.textContent;

    const series =
        seriesElement.textContent;

    const number =
        numberElement.textContent;


    const qrData =
        [
            "PROTOTYPE_TICKET",
            "SERIES=" + series,
            "NUMBER=" + number,
            "DATE=" + formatQRDate(paymentDate),
            "ROUTE=" + route,
            "AMOUNT=42",
            "VEHICLE=" + vehicle
        ].join(";");


    const qrUrl =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=360x360" +
        "&margin=0" +
        "&data=" +
        encodeURIComponent(qrData);


    qrImage.src =
        qrUrl;
}


/* =========================================================
   INITIAL UPDATE
========================================================= */

updateTimer();
generateQR();


/* =========================================================
   TIMER LOOP
========================================================= */

setInterval(
    updateTimer,
    1000
);


/* =========================================================
   CHANGE ROUTE
========================================================= */

routeElement.addEventListener(
    "click",
    function () {

        const current =
            routeElement.textContent;

        const newRoute =
            prompt(
                "Введите маршрут:",
                current
            );

        if (
            newRoute === null ||
            newRoute.trim() === ""
        ) {
            return;
        }


        routeElement.textContent =
            newRoute.trim();


        localStorage.setItem(
            STORAGE_ROUTE,
            newRoute.trim()
        );


        generateQR();
    }
);


/* =========================================================
   CHANGE VEHICLE
========================================================= */

document
    .getElementById("vehicleRow")
    .addEventListener(
        "click",
        function () {

            const current =
                vehicleElement.textContent;

            const newVehicle =
                prompt(
                    "Введите номер Т/С:",
                    current
                );

            if (
                newVehicle === null ||
                newVehicle.trim() === ""
            ) {
                return;
            }


            vehicleElement.textContent =
                newVehicle.trim();


            localStorage.setItem(
                STORAGE_VEHICLE,
                newVehicle.trim()
            );


            generateQR();
        }
    );


/* =========================================================
   CHANGE DATE
========================================================= */

dateElement.addEventListener(
    "click",
    function () {

        const current =
            formatDate(paymentDate);

        const newDate =
            prompt(
                "Введите дату и время:\nДД.ММ.ГГГГ ЧЧ:ММ",
                current
            );

        if (
            newDate === null ||
            newDate.trim() === ""
        ) {
            return;
        }


        const match =
            newDate
                .trim()
                .match(
                    /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/
                );


        if (!match) {

            alert(
                "Используйте формат:\nДД.ММ.ГГГГ ЧЧ:ММ"
            );

            return;
        }


        const day =
            Number(match[1]);

        const month =
            Number(match[2]);

        const year =
            Number(match[3]);

        const hours =
            Number(match[4]);

        const minutes =
            Number(match[5]);


        const newPaymentDate =
            new Date(
                year,
                month - 1,
                day,
                hours,
                minutes,
                0,
                0
            );


        if (
            isNaN(newPaymentDate.getTime()) ||
            newPaymentDate.getFullYear() !== year ||
            newPaymentDate.getMonth() !== month - 1 ||
            newPaymentDate.getDate() !== day
        ) {

            alert(
                "Указана некорректная дата."
            );

            return;
        }


        paymentDate =
            newPaymentDate;


        localStorage.setItem(
            STORAGE_PAYMENT,
            String(
                paymentDate.getTime()
            )
        );


        /*
         * При изменении даты
         * меняем дату и в серии,
         * и в номере.
         *
         * Суффиксы сохраняем,
         * поэтому меняется именно
         * временная часть идентификаторов.
         */

        updateTicketIdentifiers();


        dateElement.textContent =
            formatDate(paymentDate);


        updateTimer();

        generateQR();
    }
);


/* =========================================================
   NEW TICKET
========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        /*
         * Создаём новое время оплаты.
         */

        paymentDate =
            new Date();


        /*
         * Сохраняем его.
         */

        localStorage.setItem(
            STORAGE_PAYMENT,
            String(
                paymentDate.getTime()
            )
        );


        /*
         * Создаём новый случайный
         * суффикс серии.
         */

        localStorage.setItem(
            "ticketSeriesSuffix",
            String(
                Math.floor(
                    100000 +
                    Math.random() * 900000
                )
            )
        );


        /*
         * Создаём новый случайный
         * суффикс номера.
         */

        localStorage.setItem(
            "ticketNumberSuffix",
            String(
                Math.floor(
                    100 +
                    Math.random() * 900
                )
            )
        );


        /*
         * Обновляем всё.
         */

        dateElement.textContent =
            formatDate(paymentDate);


        updateTicketIdentifiers();

        updateTimer();

        generateQR();


        /*
         * Небольшая вибрация
         * на поддерживаемых устройствах.
         */

        if (
            navigator.vibrate
        ) {

            navigator.vibrate(20);
        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Билет</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f4f5f6;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
}

.ticket {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  background: #f4f5f6;
  overflow: hidden;
}

/* ================= HEADER ================= */

.header {
  position: relative;
  width: 100%;
  height: 102px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 15px;
  overflow: hidden;
  background: #2498ed;
}

.header::before {
  content: "";
  position: absolute;
  width: 370px;
  height: 95px;
  top: -58px;
  left: 50%;
  transform: translateX(-50%);
  background: #126cae;
  border-radius: 50%;
}

.header-title {
  position: relative;
  z-index: 2;
  color: #fff;
  font-size: 20px;
  line-height: 1;
  font-weight: 300;
}

/* ================= WAVE ================= */

.wave {
  position: relative;
  width: 100%;
  height: 34px;
  overflow: hidden;
  margin-top: -1px;
}

.wave::before {
  content: "";
  position: absolute;
  width: 125%;
  height: 48px;
  left: -12.5%;
  top: -17px;
  background: #c8e9ea;
  border-radius: 50% 50% 0 0 / 42% 42% 0 0;
}

.wave::after {
  content: "";
  position: absolute;
  width: 125%;
  height: 32px;
  left: -12.5%;
  top: -1px;
  background: #f4f5f6;
  border-radius: 50% 50% 0 0 / 55% 55% 0 0;
}

/* ================= CONTENT ================= */

.content {
  width: 100%;
  padding: 0 18px 30px;
  text-align: center;
}

.success {
  margin: 0;
  font-size: 18px;
  line-height: 1.3;
  font-weight: 400;
}

/* ================= ROUTE ================= */

.route {
  margin-top: 43px;
  font-size: 20px;
  line-height: 1.15;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
}

/* ================= PRICE ================= */

.price {
  margin-top: 10px;
  font-size: 48px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -1px;
}

.price span {
  font-size: 48px;
  font-weight: 400;
}

/* ================= DATE ================= */

.date {
  margin-top: 28px;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 400;
  cursor: pointer;
  user-select: none;
}

.ticket-code {
  margin-top: 7px;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 400;
}

/* ================= TIMER ================= */

.timer-title {
  margin-top: 37px;
  font-size: 18px;
  line-height: 1.3;
  font-weight: 400;
}

.timer {
  margin-top: 3px;
  font-size: 32px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}

/* ================= QR ================= */

.qr-wrapper {
  width: 360px;
  height: 360px;
  margin: 35px auto 0;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#qrcode {
  width: 360px;
  height: 360px;
  display: block;
  background: #fff;
}

#qrcode img {
  display: block;
  width: 360px !important;
  height: 360px !important;
  max-width: none !important;
  max-height: none !important;
}

/* ================= INFO ================= */

.info {
  margin-top: 38px;
  font-size: 18px;
  line-height: 1.55;
  font-weight: 400;
}

.instruction {
  margin: 39px auto 0;
  max-width: 390px;
  font-size: 18px;
  line-height: 1.48;
  font-weight: 400;
}

/* ================= BUTTON ================= */

.download {
  display: block;
  width: 100%;
  height: 76px;
  margin: 37px auto 0;
  padding: 0;
  border: none;
  border-radius: 28px;
  background: linear-gradient(
    180deg,
    #58c8d1 0%,
    #4799ee 100%
  );
  color: #fff;
  font-size: 25px;
  line-height: 1;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(60,130,190,.16);
}

.download:active {
  transform: scale(.99);
}

/* ================= MOBILE ================= */

@media (max-width: 390px) {

  .qr-wrapper,
  #qrcode,
  #qrcode img {
    width: 320px !important;
    height: 320px !important;
  }

  .content {
    padding-left: 15px;
    padding-right: 15px;
  }
}
</style>
</head>

<body>

<div class="ticket">

  <div class="header">
    <div class="header-title">
      Оплата проезда
    </div>
  </div>

  <div class="wave"></div>

  <div class="content">

    <p class="success">
      Проезд оплачен
    </p>

    <div
      class="route"
      id="route"
      title="Нажмите для изменения"
    >
      Трамвай: №3
    </div>

    <div class="price">
      42<span> ₽</span>
    </div>

    <div
      class="date"
      id="date"
      title="Нажмите для изменения"
    >
      01.09.2026 17:35
    </div>

    <div class="ticket-code">
      Т/С: <strong id="vehicle">734</strong>
    </div>

    <div class="timer-title">
      Время с момента оплаты
    </div>

    <div
      class="timer"
      id="timer"
    >
      00:00
    </div>

    <!-- QR -->
    <div class="qr-wrapper">
      <div id="qrcode"></div>
    </div>

    <div class="info">
      Серия: <span id="series">QR200938000636</span><br>
      Номер: <span id="number">20260901173500141</span>
    </div>

    <div class="instruction">
      Предъявите QR-код контролёру
      при проверке проезда
    </div>

    <button
      class="download"
      id="downloadButton"
      type="button"
    >
      Скачать билет
    </button>

  </div>
</div>


<script>
(function () {

  /* =========================================================
     НАСТРОЙКИ
  ========================================================= */

  const STORAGE_PAYMENT = "ticketPaymentDate";
  const STORAGE_ROUTE = "ticketRoute";
  const STORAGE_VEHICLE = "ticketVehicle";

  const DEFAULT_ROUTE = "Трамвай: №3";
  const DEFAULT_VEHICLE = "734";

  const ticketSeries = "QR200938000636";
  const ticketNumber = "20260901173500141";


  /* =========================================================
     СОСТОЯНИЕ
  ========================================================= */

  let paymentDate;


  /* =========================================================
     ПОЛУЧАЕМ СОХРАНЁННУЮ ДАТУ ОПЛАТЫ
  ========================================================= */

  const savedPayment = localStorage.getItem(STORAGE_PAYMENT);

  if (
    savedPayment &&
    !isNaN(Number(savedPayment))
  ) {

    paymentDate = new Date(
      Number(savedPayment)
    );

  } else {

    paymentDate = new Date();

    localStorage.setItem(
      STORAGE_PAYMENT,
      String(paymentDate.getTime())
    );
  }


  /* =========================================================
     ROUTE
  ========================================================= */

  let route =
    localStorage.getItem(STORAGE_ROUTE)
    || DEFAULT_ROUTE;


  /* =========================================================
     VEHICLE
  ========================================================= */

  let vehicle =
    localStorage.getItem(STORAGE_VEHICLE)
    || DEFAULT_VEHICLE;


  /* =========================================================
     DOM
  ========================================================= */

  const routeElement =
    document.getElementById("route");

  const vehicleElement =
    document.getElementById("vehicle");

  const dateElement =
    document.getElementById("date");

  const timerElement =
    document.getElementById("timer");

  const qrElement =
    document.getElementById("qrcode");

  const downloadButton =
    document.getElementById("downloadButton");


  /* =========================================================
     DATE FORMAT
  ========================================================= */

  function pad(number) {
    return String(number).padStart(2, "0");
  }


  function formatDate(date) {

    return (
      pad(date.getDate()) +
      "." +
      pad(date.getMonth() + 1) +
      "." +
      date.getFullYear() +
      " " +
      pad(date.getHours()) +
      ":" +
      pad(date.getMinutes())
    );

  }


  function formatQRDate(date) {

    return (
      date.getFullYear() +
      pad(date.getMonth() + 1) +
      pad(date.getDate()) +
      "T" +
      pad(date.getHours()) +
      pad(date.getMinutes()) +
      pad(date.getSeconds())
    );

  }


  /* =========================================================
     TIMER
  ========================================================= */

  function formatTimer(seconds) {

    seconds = Math.max(
      0,
      Math.floor(seconds)
    );

    const hours =
      Math.floor(seconds / 3600);

    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );

    const secs =
      seconds % 60;


    if (hours > 0) {

      return (
        pad(hours) +
        ":" +
        pad(minutes) +
        ":" +
        pad(secs)
      );

    }

    return (
      pad(minutes) +
      ":" +
      pad(secs)
    );
  }


  function updateTimer() {

    if (!paymentDate) return;

    const now =
      Date.now();

    const paidAt =
      paymentDate.getTime();

    let elapsed =
      Math.floor(
        (now - paidAt) / 1000
      );

    if (elapsed < 0) {
      elapsed = 0;
    }

    timerElement.textContent =
      formatTimer(elapsed);
  }


  /*
   * ВАЖНО:
   * Таймер не считает сам себя.
   * Каждые 250 мс он заново смотрит
   * на реальное время Date.now().
   */

  updateTimer();

  setInterval(
    updateTimer,
    250
  );


  /* =========================================================
     DISPLAY
  ========================================================= */

  function updateDisplay() {

    routeElement.textContent =
      route;

    vehicleElement.textContent =
      vehicle;

    dateElement.textContent =
      formatDate(paymentDate);

    updateTimer();
  }


  /* =========================================================
     QR
  ========================================================= */

  function generateQR() {

    /*
     * Формируем содержимое QR.
     */

    const qrData =
      "TICKET" +
      ";SERIES=" +
      encodeURIComponent(ticketSeries) +
      ";NUMBER=" +
      encodeURIComponent(ticketNumber) +
      ";DATE=" +
      encodeURIComponent(
        formatQRDate(paymentDate)
      ) +
      ";ROUTE=" +
      encodeURIComponent(route) +
      ";AMOUNT=42" +
      ";VEHICLE=" +
      encodeURIComponent(vehicle);


    /*
     * Очищаем старый QR.
     */

    qrElement.innerHTML = "";


    /*
     * Используем внешний QR-сервис.
     *
     * Здесь больше НЕТ qrcodejs,
     * поэтому отсутствует проблема
     * с загрузкой библиотеки.
     */

    const img =
      document.createElement("img");


    img.alt =
      "QR-код билета";

    img.width = 360;

    img.height = 360;


    img.src =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=360x360" +
      "&margin=0" +
      "&data=" +
      encodeURIComponent(qrData);


    img.onerror =
      function () {

        qrElement.innerHTML =
          "<div style=\"" +
          "width:360px;" +
          "height:360px;" +
          "display:flex;" +
          "align-items:center;" +
          "justify-content:center;" +
          "font-size:16px;" +
          "color:#777;" +
          "text-align:center;" +
          "padding:30px;" +
          "\">" +
          "Не удалось загрузить QR-код" +
          "</div>";

      };


    qrElement.appendChild(img);
  }


  /* =========================================================
     EDIT ROUTE
  ========================================================= */

  routeElement.addEventListener(
    "click",
    function () {

      const newRoute =
        prompt(
          "Введите маршрут:",
          route
        );


      if (
        newRoute !== null &&
        newRoute.trim() !== ""
      ) {

        route =
          newRoute.trim();

        localStorage.setItem(
          STORAGE_ROUTE,
          route
        );

        updateDisplay();

        generateQR();
      }

    }
  );


  /* =========================================================
     EDIT VEHICLE
  ========================================================= */

  vehicleElement.parentElement.addEventListener(
    "click",
    function () {

      const newVehicle =
        prompt(
          "Введите номер Т/С:",
          vehicle
        );


      if (
        newVehicle !== null &&
        newVehicle.trim() !== ""
      ) {

        vehicle =
          newVehicle.trim();

        localStorage.setItem(
          STORAGE_VEHICLE,
          vehicle
        );

        updateDisplay();

        generateQR();
      }

    }
  );


  /* =========================================================
     EDIT DATE
  ========================================================= */

  dateElement.addEventListener(
    "click",
    function () {

      const current =
        formatDate(paymentDate);


      const value =
        prompt(
          "Введите дату и время в формате ДД.ММ.ГГГГ ЧЧ:ММ",
          current
        );


      if (!value) return;


      const match =
        value.match(
          /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/
        );


      if (!match) {

        alert(
          "Неверный формат.\n\n" +
          "Используйте:\n" +
          "01.09.2026 17:35"
        );

        return;
      }


      const day =
        Number(match[1]);

      const month =
        Number(match[2]) - 1;

      const year =
        Number(match[3]);

      const hours =
        Number(match[4]);

      const minutes =
        Number(match[5]);


      const newDate =
        new Date(
          year,
          month,
          day,
          hours,
          minutes,
          0
        );


      if (
        isNaN(newDate.getTime())
      ) {

        alert(
          "Не удалось установить дату."
        );

        return;
      }


      paymentDate =
        newDate;


      localStorage.setItem(
        STORAGE_PAYMENT,
        String(
          paymentDate.getTime()
        )
      );


      updateDisplay();

      generateQR();
    }
  );


  /* =========================================================
     BUTTON
  ========================================================= */

  downloadButton.addEventListener(
    "click",
    function () {

      /*
       * НОВАЯ ОПЛАТА.
       *
       * Сбрасываем таймер именно
       * в момент нажатия кнопки.
       */

      paymentDate =
        new Date();


      /*
       * Сохраняем новый момент оплаты.
       */

      localStorage.setItem(
        STORAGE_PAYMENT,
        String(
          paymentDate.getTime()
        )
      );


      /*
       * Сразу показываем 00:00.
       */

      timerElement.textContent =
        "00:00";


      /*
       * Обновляем дату.
       */

      dateElement.textContent =
        formatDate(paymentDate);


      /*
       * Перегенерируем QR
       * с новой датой.
       */

      generateQR();


      /*
       * Небольшая вибрация
       * на телефоне.
       */

      if (
        navigator.vibrate
      ) {

        navigator.vibrate(20);

      }

    }
  );


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  updateDisplay();

  generateQR();

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Уведомление об оплате</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f2f3f4;
  font-family: Arial, Helvetica, sans-serif;
  color: #111;
}

.ticket {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  background: #f2f3f4;
  overflow: hidden;
}


/* =========================================================
   ШАПКА
========================================================= */

.header {
  position: relative;
  width: 100%;
  height: 89px;
  overflow: hidden;
  background: #209df7;
}


/*
   SVG находится поверх голубого фона.
   Тёмно-синяя форма имеет именно
   плавную диагонально-изогнутую нижнюю границу.
*/

.header-shape {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: block;
}


/* Заголовок */

.header-title {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 15px;

  z-index: 5;

  text-align: center;

  color: #fff;

  font-size: 20px;
  line-height: 1;

  font-weight: 400;

  white-space: nowrap;
}


/* =========================================================
   ГОЛУБАЯ И БЕЛАЯ ВОЛНА
========================================================= */

.wave {
  position: relative;

  width: 100%;
  height: 35px;

  overflow: hidden;

  background: #f2f3f4;
}


/*
   Здесь тоже SVG.

   Поэтому голубая полоса не будет
   превращаться в прямую линию.
*/

.wave-svg {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  display: block;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
  width: 100%;

  padding:
    0
    18px
    30px;

  text-align: center;
}


/* =========================================================
   SUCCESS
========================================================= */

.success {
  margin: 0;

  font-size: 18px;
  line-height: 1.3;

  font-weight: 400;
}


/* =========================================================
   ROUTE
========================================================= */

.route {
  margin-top: 43px;

  font-size: 20px;
  line-height: 1.15;

  font-weight: 700;

  cursor: pointer;
  user-select: none;
}


/* =========================================================
   PRICE
========================================================= */

.price {
  margin-top: 10px;

  font-size: 48px;
  line-height: 1;

  font-weight: 700;

  letter-spacing: -1px;
}

.price span {
  font-size: 48px;

  font-weight: 400;
}


/* =========================================================
   DATE
========================================================= */

.date {
  margin-top: 28px;

  font-size: 18px;
  line-height: 1.2;

  font-weight: 400;

  cursor: pointer;
  user-select: none;
}


/* =========================================================
   Т/С
========================================================= */

.ticket-code {
  margin-top: 7px;

  font-size: 18px;
  line-height: 1.2;

  /*
     ВАЖНО:
     Весь Т/С обычный.
  */

  font-weight: 400;

  cursor: pointer;
  user-select: none;
}


/*
   Номер Т/С тоже обычный,
   несмотря на strong в HTML.
*/

.ticket-code strong {
  font-weight: 400;
}


/* =========================================================
   TIMER
========================================================= */

.timer-title {
  margin-top: 37px;

  font-size: 18px;
  line-height: 1.3;

  font-weight: 400;
}

.timer {
  margin-top: 3px;

  font-size: 32px;
  line-height: 1;

  font-weight: 700;

  letter-spacing: -0.5px;

  font-variant-numeric: tabular-nums;
}


/* =========================================================
   QR
========================================================= */

.qr-wrapper {
  width: 360px;
  height: 360px;

  margin: 35px auto 0;

  background: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#qrcode {
  width: 360px;
  height: 360px;

  display: block;

  background: #fff;
}

#qrcode img {
  display: block;

  width: 360px !important;
  height: 360px !important;

  max-width: none !important;
  max-height: none !important;
}


/* =========================================================
   СЕРИЯ / НОМЕР
========================================================= */

.info {
  margin-top: 38px;

  font-size: 18px;
  line-height: 1.55;

  font-weight: 400;
}


/*
   Только сами значения —
   жирные.
*/

.info span {
  font-weight: 700;
}


/* =========================================================
   ИНСТРУКЦИЯ
========================================================= */

.instruction {
  margin: 39px auto 0;

  max-width: 390px;

  font-size: 18px;
  line-height: 1.48;

  font-weight: 400;
}


/* =========================================================
   КНОПКА
========================================================= */

.download {
  display: block;

  width: 100%;
  height: 76px;

  margin: 37px auto 0;

  padding: 0;

  border: none;

  border-radius: 28px;

  background:
    linear-gradient(
      180deg,
      #58c8d1 0%,
      #4799ee 100%
    );

  color: #fff;

  /*
     Было 25px.
     Теперь меньше.
  */

  font-size: 20px;

  line-height: 1;

  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 10px 28px
    rgba(60,130,190,.16);
}

.download:active {
  transform: scale(.99);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 390px) {

  .qr-wrapper,
  #qrcode,
  #qrcode img {

    width: 320px !important;
    height: 320px !important;

  }

  .content {

    padding-left: 15px;
    padding-right: 15px;

  }

}

</style>
</head>


<body>


<div class="ticket">


  <!-- =====================================================
       ШАПКА
  ====================================================== -->

  <div class="header">

    <!--
      Тёмно-синяя фигура.
      Кривая повторяется SVG-путём.
    -->

    <svg
      class="header-shape"
      viewBox="0 0 430 89"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >

      <!-- Основной голубой фон -->
      <rect
        x="0"
        y="0"
        width="430"
        height="89"
        fill="#209DF7"
      />

      <!-- Тёмно-синяя верхняя форма -->
      <path
        d="
          M 137 0
          C 161 14,
            190 25,
            222 29
          C 279 36,
            350 25,
            430 22
          L 430 0
          Z
        "
        fill="#0065B0"
      />

    </svg>


    <div class="header-title">
      — Уведомление об оплате —
    </div>

  </div>


  <!-- =====================================================
       ГОЛУБАЯ ВОЛНА
  ====================================================== -->

  <div class="wave">

    <svg
      class="wave-svg"
      viewBox="0 0 430 35"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >

      <!--
        Голубая полоса.

        Верхняя граница:
        слева ниже,
        в центре выше,
        справа снова немного ниже.

        Нижняя граница тоже плавно
        повторяет изгиб.
      -->

      <path
        d="
          M 0 5
          C 65 -2,
            122 -8,
            185 -5
          C 270 -1,
            350 5,
            430 0

          L 430 29

          C 350 22,
            270 15,
            185 16

          C 115 17,
            60 24,
            0 30

          Z
        "
        fill="#BDECEE"
      />


      <!--
        Светлая область снизу.
        Она формирует мягкую белую волну.
      -->

      <path
        d="
          M 0 30
          C 60 24,
            115 17,
            185 16

          C 270 15,
            350 22,
            430 29

          L 430 35
          L 0 35
          Z
        "
        fill="#F2F3F4"
      />

    </svg>

  </div>


  <!-- =====================================================
       ОСНОВНОЙ КОНТЕНТ
  ====================================================== -->

  <div class="content">


    <p class="success">
      Проезд оплачен
    </p>


    <!-- МАРШРУТ -->

    <div
      class="route"
      id="route"
      title="Нажмите для изменения"
    >
      Трамвай: №3
    </div>


    <!-- ЦЕНА -->

    <div class="price">
      42<span> ₽</span>
    </div>


    <!-- ДАТА -->

    <div
      class="date"
      id="date"
      title="Нажмите для изменения"
    >
      01.09.2026 17:35
    </div>


    <!-- Т/С -->

    <div
      class="ticket-code"
      id="vehicleRow"
      title="Нажмите для изменения"
    >
      Т/С: <strong id="vehicle">734</strong>
    </div>


    <!-- ТАЙМЕР -->

    <div class="timer-title">
      Время с момента оплаты
    </div>

    <div
      class="timer"
      id="timer"
    >
      00:00
    </div>


    <!-- QR -->

    <div class="qr-wrapper">

      <div id="qrcode"></div>

    </div>


    <!-- СЕРИЯ / НОМЕР -->

    <div class="info">

      Серия:
      <span id="series">
        QR200938000636
      </span>

      <br>

      Номер:
      <span id="number">
        20260901173500141
      </span>

    </div>


    <!-- ИНСТРУКЦИЯ -->

    <div class="instruction">

      Предъявите QR-код контролёру
      при проверке проезда

    </div>


    <!-- КНОПКА -->

    <button
      class="download"
      id="downloadButton"
      type="button"
    >
      Скачать билет
    </button>


  </div>

</div>



<script>

(function () {


  /* =====================================================
     НАСТРОЙКИ
  ===================================================== */

  const STORAGE_PAYMENT =
    "ticketPaymentDate";

  const STORAGE_ROUTE =
    "ticketRoute";

  const STORAGE_VEHICLE =
    "ticketVehicle";


  const DEFAULT_ROUTE =
    "Трамвай: №3";

  const DEFAULT_VEHICLE =
    "734";


  const ticketSeries =
    "QR200938000636";

  const ticketNumber =
    "20260901173500141";


  /* =====================================================
     ДАТА ПОКУПКИ
  ===================================================== */

  let paymentDate;


  const savedPayment =
    localStorage.getItem(
      STORAGE_PAYMENT
    );


  if (
    savedPayment &&
    !isNaN(Number(savedPayment))
  ) {

    paymentDate =
      new Date(
        Number(savedPayment)
      );

  } else {

    paymentDate =
      new Date();


    localStorage.setItem(
      STORAGE_PAYMENT,
      String(
        paymentDate.getTime()
      )
    );

  }


  /* =====================================================
     МАРШРУТ
  ===================================================== */

  let route =
    localStorage.getItem(
      STORAGE_ROUTE
    ) ||
    DEFAULT_ROUTE;


  /* =====================================================
     Т/С
  ===================================================== */

  let vehicle =
    localStorage.getItem(
      STORAGE_VEHICLE
    ) ||
    DEFAULT_VEHICLE;


  /* =====================================================
     DOM
  ===================================================== */

  const routeElement =
    document.getElementById(
      "route"
    );


  const vehicleElement =
    document.getElementById(
      "vehicle"
    );


  const vehicleRow =
    document.getElementById(
      "vehicleRow"
    );


  const dateElement =
    document.getElementById(
      "date"
    );


  const timerElement =
    document.getElementById(
      "timer"
    );


  const qrElement =
    document.getElementById(
      "qrcode"
    );


  const downloadButton =
    document.getElementById(
      "downloadButton"
    );


  /* =====================================================
     PAD
  ===================================================== */

  function pad(number) {

    return String(number)
      .padStart(2, "0");

  }


  /* =====================================================
     ФОРМАТ ДАТЫ
  ===================================================== */

  function formatDate(date) {

    return (

      pad(date.getDate()) +

      "." +

      pad(
        date.getMonth() + 1
      ) +

      "." +

      date.getFullYear() +

      " " +

      pad(
        date.getHours()
      ) +

      ":" +

      pad(
        date.getMinutes()
      )

    );

  }


  /* =====================================================
     ДАТА ДЛЯ QR
  ===================================================== */

  function formatQRDate(date) {

    return (

      date.getFullYear() +

      pad(
        date.getMonth() + 1
      ) +

      pad(
        date.getDate()
      ) +

      "T" +

      pad(
        date.getHours()
      ) +

      pad(
        date.getMinutes()
      ) +

      pad(
        date.getSeconds()
      )

    );

  }


  /* =====================================================
     ТАЙМЕР
  ===================================================== */

  function updateTimer() {

    const now =
      new Date();


    /*
       Сколько секунд сейчас
       на часах.

       Например:

       12:41:20

       = 20 секунд
    */

    const currentSeconds =
      now.getSeconds();


    /*
       Сколько осталось
       до следующей минуты.

       60 - 20 = 40

       Поэтому:

       12:41:20 → 00:40
    */

    let remainingSeconds =
      60 - currentSeconds;


    /*
       Ровно в начале минуты:

       12:42:00 → 01:00
    */

    if (
      currentSeconds === 0
    ) {

      remainingSeconds = 60;

    }


    /*
       Сколько полных минут прошло
       с момента покупки.
    */

    let elapsedMinutes =
      Math.floor(

        (
          now.getTime() -
          paymentDate.getTime()
        ) / 60000

      );


    if (
      elapsedMinutes < 0
    ) {

      timerElement.textContent =
        "00:00";

      return;

    }


    /*
       Например:

       покупка 12:40

       12:40:20
       → 00:40

       12:41:00
       → 01:00

       12:41:20
       → 01:40

       12:42:00
       → 02:00
    */

    timerElement.textContent =

      pad(elapsedMinutes) +

      ":" +

      pad(remainingSeconds);

  }


  /*
     Обновляем 4 раза в секунду.
  */

  updateTimer();

  setInterval(
    updateTimer,
    250
  );


  /* =====================================================
     ОБНОВЛЕНИЕ ЭКРАНА
  ===================================================== */

  function updateDisplay() {

    routeElement.textContent =
      route;


    vehicleElement.textContent =
      vehicle;


    dateElement.textContent =
      formatDate(
        paymentDate
      );


    updateTimer();

  }


  /* =====================================================
     QR
  ===================================================== */

  function generateQR() {


    const qrData =

      "TICKET" +

      ";SERIES=" +

      encodeURIComponent(
        ticketSeries
      ) +

      ";NUMBER=" +

      encodeURIComponent(
        ticketNumber
      ) +

      ";DATE=" +

      encodeURIComponent(
        formatQRDate(
          paymentDate
        )
      ) +

      ";ROUTE=" +

      encodeURIComponent(
        route
      ) +

      ";AMOUNT=42" +

      ";VEHICLE=" +

      encodeURIComponent(
        vehicle
      );


    qrElement.innerHTML = "";


    const img =
      document.createElement(
        "img"
      );


    img.alt =
      "QR-код билета";


    img.width =
      360;


    img.height =
      360;


    img.src =

      "https://api.qrserver.com/v1/create-qr-code/" +

      "?size=360x360" +

      "&margin=0" +

      "&data=" +

      encodeURIComponent(
        qrData
      );


    img.onerror =
      function () {

        qrElement.innerHTML =

          "<div style=\"" +

          "width:360px;" +
          "height:360px;" +

          "display:flex;" +

          "align-items:center;" +

          "justify-content:center;" +

          "font-size:16px;" +

          "color:#777;" +

          "text-align:center;" +

          "padding:30px;" +

          "\">" +

          "Не удалось загрузить QR-код" +

          "</div>";

      };


    qrElement.appendChild(
      img
    );

  }


  /* =====================================================
     ИЗМЕНЕНИЕ МАРШРУТА
  ===================================================== */

  routeElement.addEventListener(
    "click",
    function () {

      const newRoute =
        prompt(
          "Введите маршрут:",
          route
        );


      if (

        newRoute !== null &&

        newRoute.trim() !== ""

      ) {

        route =
          newRoute.trim();


        localStorage.setItem(
          STORAGE_ROUTE,
          route
        );


        updateDisplay();

        generateQR();

      }

    }
  );


  /* =====================================================
     ИЗМЕНЕНИЕ Т/С
  ===================================================== */

  vehicleRow.addEventListener(
    "click",
    function () {

      const newVehicle =
        prompt(
          "Введите номер Т/С:",
          vehicle
        );


      if (

        newVehicle !== null &&

        newVehicle.trim() !== ""

      ) {

        vehicle =
          newVehicle.trim();


        localStorage.setItem(
          STORAGE_VEHICLE,
          vehicle
        );


        updateDisplay();

        generateQR();

      }

    }
  );


  /* =====================================================
     ИЗМЕНЕНИЕ ДАТЫ
  ===================================================== */

  dateElement.addEventListener(
    "click",
    function () {

      const current =
        formatDate(
          paymentDate
        );


      const value =
        prompt(

          "Введите дату и время:\n\n" +

          "ДД.ММ.ГГГГ ЧЧ:ММ",

          current

        );


      if (!value) {

        return;

      }


      const match =
        value.match(

          /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/

        );


      if (!match) {

        alert(

          "Неверный формат.\n\n" +

          "Например:\n" +

          "01.09.2026 12:40"

        );

        return;

      }


      const day =
        Number(match[1]);


      const month =
        Number(match[2]) - 1;


      const year =
        Number(match[3]);


      const hours =
        Number(match[4]);


      const minutes =
        Number(match[5]);


      const newDate =
        new Date(

          year,
          month,
          day,
          hours,
          minutes,
          0

        );


      if (
        isNaN(
          newDate.getTime()
        )
      ) {

        alert(
          "Не удалось установить дату."
        );

        return;

      }


      paymentDate =
        newDate;


      localStorage.setItem(

        STORAGE_PAYMENT,

        String(
          paymentDate.getTime()
        )

      );


      updateDisplay();

      generateQR();

    }
  );


  /* =====================================================
     КНОПКА
  ===================================================== */

  downloadButton.addEventListener(
    "click",
    function () {


      /*
         Новый момент покупки.
      */

      paymentDate =
        new Date();


      localStorage.setItem(

        STORAGE_PAYMENT,

        String(
          paymentDate.getTime()
        )

      );


      dateElement.textContent =
        formatDate(
          paymentDate
        );


      updateTimer();


      generateQR();


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(20);

      }

    }
  );


  /* =====================================================
     ЗАПУСК
  ===================================================== */

  updateDisplay();

  generateQR();


})();

</script>

</body>
</html>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f4f5f6;
    font-family: "Roboto", Arial, sans-serif;
    color: #444;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

body {
    overflow-x: hidden;
}

button {
    font-family: "Roboto", Arial, sans-serif;
}


/* =========================
   ОСНОВНОЙ КОНТЕЙНЕР
========================= */

.ticket {
    width: 100%;
    min-height: 100vh;
    background: #f4f5f6;
}


/* =========================
   ВЕРХНИЙ СИНИЙ БЛОК
========================= */

.header {
    position: relative;
    width: 100%;
    height: 102px;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    padding-bottom: 15px;

    overflow: hidden;

    background: #2498ed;
}


/* верхняя тёмная дуга */

.header::before {
    content: "";

    position: absolute;

    width: 370px;
    height: 95px;

    top: -58px;
    left: 50%;

    transform: translateX(-50%);

    background: #126cae;

    border-radius: 50%;
}


/* заголовок */

.header-title {
    position: relative;
    z-index: 2;

    color: #ffffff;

    font-size: 20px;
    line-height: 1;

    font-weight: 300;

    white-space: nowrap;

    letter-spacing: 0;
}

.header-title::before {
    content: "—";
    margin-right: 7px;
}

.header-title::after {
    content: "—";
    margin-left: 7px;
}


/* =========================
   ДЕКОРАТИВНАЯ ВОЛНА
========================= */

.wave {
    position: relative;

    width: 100%;
    height: 34px;

    overflow: hidden;

    margin-top: -1px;
}

.wave::before {
    content: "";

    position: absolute;

    width: 125%;
    height: 48px;

    left: -12.5%;
    top: -17px;

    background: #c8e9ea;

    border-radius:
        50% 50% 0 0 /
        42% 42% 0 0;
}

.wave::after {
    content: "";

    position: absolute;

    width: 125%;
    height: 32px;

    left: -12.5%;
    top: -1px;

    background: #f4f5f6;

    border-radius:
        50% 50% 0 0 /
        55% 55% 0 0;
}


/* =========================
   ОСНОВНОЙ КОНТЕНТ
========================= */

.content {
    width: 100%;

    padding:
        0
        18px
        30px;

    text-align: center;
}


/* =========================
   УСПЕШНАЯ ОПЛАТА
========================= */

.success {
    margin: 0;

    font-size: 18px;
    line-height: 1.3;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   ТРАМВАЙ
========================= */

.route {
    margin-top: 43px;

    font-size: 20px;
    line-height: 1.15;

    font-weight: 700;

    letter-spacing: 0;
}


/* =========================
   ЦЕНА
========================= */

.price {
    margin-top: 10px;

    font-size: 48px;
    line-height: 1;

    font-weight: 700;

    letter-spacing: -1px;
}

.price span {
    font-size: 48px;

    font-weight: 400;

    letter-spacing: -1px;
}


/* =========================
   ДАТА
========================= */

.date {
    margin-top: 28px;

    font-size: 18px;
    line-height: 1.2;

    font-weight: 400;

    letter-spacing: 0;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   Т/С
========================= */

.ticket-code {
    margin-top: 7px;

    font-size: 18px;
    line-height: 1.2;

    font-weight: 400;

    cursor: pointer;

    user-select: none;

    -webkit-tap-highlight-color: transparent;
}

.ticket-code strong {
    font-weight: 400;
}


/* =========================
   ТАЙМЕР — ЗАГОЛОВОК
========================= */

.timer-title {
    margin-top: 37px;

    font-size: 18px;
    line-height: 1.3;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   ТАЙМЕР
========================= */

.timer {
    margin-top: 3px;

    font-size: 32px;
    line-height: 1;

    font-weight: 700;

    letter-spacing: -0.5px;

    font-variant-numeric: tabular-nums;
}


/* =========================
   QR
========================= */

.qr-wrapper {
    width: 360px;
    height: 360px;

    margin: 35px auto 0;

    background: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#qrcode {
    width: 360px;
    height: 360px;

    display: flex;
    align-items: center;
    justify-content: center;
}

#qrcode img,
#qrcode canvas {
    width: 360px !important;
    height: 360px !important;

    display: block;
}


/* =========================
   СЕРИЯ И НОМЕР
========================= */

.info {
    margin-top: 38px;

    font-size: 18px;
    line-height: 1.55;

    font-weight: 400;

    letter-spacing: 0;
}

.info strong {
    font-weight: 700;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction {
    margin: 39px auto 0;

    max-width: 390px;

    font-size: 18px;
    line-height: 1.48;

    font-weight: 400;

    letter-spacing: 0;
}


/* =========================
   КНОПКА
========================= */

.download {
    display: block;

    width: 100%;
    height: 76px;

    margin: 37px auto 0;

    padding: 0;

    border: none;
    border-radius: 28px;

    background:
        linear-gradient(
            180deg,
            #58c8d1 0%,
            #4799ee 100%
        );

    color: #ffffff;

    font-size: 25px;
    line-height: 1;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 28px
        rgba(60,130,190,0.16);

    -webkit-tap-highlight-color: transparent;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.download:active {
    transform: scale(.985);

    box-shadow:
        0 5px 15px
        rgba(60,130,190,.12);
}


/* =========================
   ДОМЕН
========================= */

.domain {
    display: inline-block;

    margin-top: 15px;

    padding:
        10px
        23px;

    border-radius: 30px;

    background: #ffffff;

    color: #222;

    font-size: 16px;
    line-height: 1;

    font-weight: 400;

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.05);
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 601px) {

    .content {
        max-width: 520px;
        margin: 0 auto;
    }

}


/* =========================
   МАЛЕНЬКИЕ ЭКРАНЫ
========================= */

@media (max-width: 390px) {

    .header {
        height: 100px;
    }

    .header-title {
        font-size: 18px;
    }

    .success {
        font-size: 17px;
    }

    .route {
        font-size: 19px;
        margin-top: 40px;
    }

    .price,
    .price span {
        font-size: 44px;
    }

    .date,
    .ticket-code,
    .timer-title,
    .info,
    .instruction {
        font-size: 17px;
    }

    .timer {
        font-size: 30px;
    }

    .qr-wrapper {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    #qrcode {
        width: 100%;
        height: 100%;
    }

    #qrcode img,
    #qrcode canvas {
        width: 100% !important;
        height: 100% !important;
    }

}

</style>

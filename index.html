* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    background: #F2F3F4;
    color: #424142;
    font-family: "Circe", sans-serif;
}

.ticket {
    width: 430px;
    max-width: 100%;
    margin: 0;
    padding: 0;
    background: #F2F3F4;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
}

.header {
    position: relative;
    width: 100%;
    height: 128px;
    background: #209DF5;
    overflow: hidden;
}

.header-dark {
    position: absolute;
    inset: 0 0 auto 0;
    width: 100%;
    height: 72px;
    z-index: 1;
    pointer-events: none;
}

.header-wave {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 43px;
    z-index: 3;
    pointer-events: none;
}

.header-title {
    position: absolute;
    left: 0;
    right: 0;
    top: 65px;
    z-index: 5;
    text-align: center;
    color: #fff;
    font-family: "Circe", sans-serif;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
}

.content {
    width: 100%;
    margin: 0;
    padding: 5px 30px 30px;
    text-align: center;
}

.success {
    margin: 0;
    color: #424142;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 400;
}

.route {
    margin-top: 37px;
    color: #424142;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
}

.price {
    margin-top: 12px;
    color: #424142;
    font-size: 48px;
    line-height: .9;
    font-weight: 700;
    letter-spacing: -2px;
    font-variant-numeric: lining-nums;
}

.price .rub {
   display: inline-block;
    margin-left: 4px;
    color: #424142;
    font-size: 45px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -1px;
    vertical-align: baseline;
}

.date {
    margin-top: 27px;
    color: #424142;
    font-size: 18px;
    line-height: 1;
    font-weight: 400;
    cursor: pointer;
    user-select: none;
}

.vehicle {
    margin-top: 8px;
    color: #424142;
    font-size: 18px;
    line-height: 1;
    font-weight: 400;
    cursor: pointer;
    user-select: none;
}

.vehicle strong {
    font-weight: 400;
}

.timer-title {
    margin-top: 40px;
    color: #424142;
    font-size: 18px;
    line-height: 1;
    font-weight: 400;
}

.timer {
    margin-top: 4px;
    color: #424142;
    font-size: 32px;
    line-height: 1;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.qr-wrapper {
    width: 360px;
    height: 360px;
    max-width: 100%;
    margin: 20px auto 15px;
    padding: 0;
    background: #fff;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.qr-wrapper img {
    display: block;
    width: 360px;
    height: 360px;
    object-fit: contain;
}

.info {
    color: #424142;
    font-size: 18px;
    line-height: 1.45;
    font-weight: 400;
}

.info strong {
    color: #424142;
    font-weight: 700;
}

.instruction {
    margin-top: 17px;
    color: #424142;
    font-size: 17px;
    line-height: 1.3;
    font-weight: 400;
}

.download {
    width: 100%;
    height: 76px;
    margin-top: 23px;
    padding: 0;
    border: 0;
    border-radius: 28px;
    background: linear-gradient(105deg, #58C8D1 0%, #4799EE 100%);
    color: #fff;
    font-family: "Circe", sans-serif;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    cursor: pointer;
}

.download:active {
    transform: scale(.985);
}

@media (max-width: 430px) {
    .content {
        padding-left: 20px;
        padding-right: 20px;
    }

    .qr-wrapper {
        width: 360px;
        height: 360px;
        max-width: 100%;
    }

    .qr-wrapper img {
        max-width: 100%;
        max-height: 100%;
    }
}
</style>
</head>

<body>

<div class="ticket">

    <div class="header">

        <!-- Верхний тёмно-синий изгиб -->
        <svg class="header-dark"
             viewBox="0 0 430 72"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg">
            <path
                d="M150 0
                   C174 12 194 22 222 29
                   C267 40 321 37 366 34
                   C391 32 412 32 430 34
                   L430 0 Z"
                fill="#0067B3"/>
        </svg>

        <!-- Голубая волна -->
        <svg class="header-wave"
             viewBox="0 0 430 43"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg">

            <path
                d="M0 8
                   C60 -1 123 -4 187 0
                   C269 5 350 11 430 5
                   L430 30
                   C350 24 274 17 188 17
                   C119 18 59 25 0 32 Z"
                fill="#BDEBED"/>

            <path
                d="M0 32
                   C59 25 119 18 188 17
                   C274 17 350 24 430 30
                   L430 43
                   L0 43 Z"
                fill="#F2F3F4"/>
        </svg>

        <div class="header-title">
            — Уведомление об оплате —
        </div>
    </div>

    <div class="content">

        <div class="success">
            Ваш проезд успешно оплачен!
        </div>

        <div class="route" id="route">
            Трамвай: №3
        </div>

        <div class="price">
            42<span class="rub"> ₽</span>
        </div>

        <div class="date" id="date">
            02.09.2026 11:04
        </div>

        <div class="vehicle" id="vehicleRow">
            Т/С: <strong id="vehicle">734</strong>
        </div>

        <div class="timer-title">
            С момента оплаты прошло:
        </div>

        <div class="timer" id="timer">
            00:00
        </div>

        <div class="qr-wrapper">
            <img id="qrImage" src="" alt="QR-код">
        </div>

        <div class="info">
            Серия: <strong id="series"></strong><br>
            Номер: <strong id="number"></strong>
        </div>

        <div class="instruction">
            Предъявите QR-код контролёру при проверке проезда
        </div>

        <button class="download" id="downloadButton" type="button">
            Скачать билет
        </button>

    </div>
</div>

<script>
const KEY = {
    payment: "ticketPaymentDate",
    route: "ticketRoute",
    vehicle: "ticketVehicle",
    series: "ticketSeries",
    number: "ticketNumber",
    seriesSuffix: "ticketSeriesSuffix",
    numberSuffix: "ticketNumberSuffix"
};

const route = document.getElementById("route");
const vehicle = document.getElementById("vehicle");
const date = document.getElementById("date");
const timer = document.getElementById("timer");
const series = document.getElementById("series");
const number = document.getElementById("number");
const qr = document.getElementById("qrImage");
const downloadButton = document.getElementById("downloadButton");

function pad(n) {
    return String(n).padStart(2, "0");
}

let paymentDate;

const savedPayment = localStorage.getItem(KEY.payment);

if (savedPayment && !isNaN(Number(savedPayment))) {
    paymentDate = new Date(Number(savedPayment));
} else {
    paymentDate = new Date();
    paymentDate.setSeconds(0, 0);

    localStorage.setItem(
        KEY.payment,
        String(paymentDate.getTime())
    );
}

route.textContent =
    localStorage.getItem(KEY.route) || "Трамвай: №3";

vehicle.textContent =
    localStorage.getItem(KEY.vehicle) || "734";

localStorage.setItem(KEY.route, route.textContent);
localStorage.setItem(KEY.vehicle, vehicle.textContent);

function formatDate(d) {
    return (
        pad(d.getDate()) + "." +
        pad(d.getMonth() + 1) + "." +
        d.getFullYear() + " " +
        pad(d.getHours()) + ":" +
        pad(d.getMinutes())
    );
}

function formatQRDate(d) {
    return (
        d.getFullYear() +
        pad(d.getMonth() + 1) +
        pad(d.getDate()) +
        "T" +
        pad(d.getHours()) +
        pad(d.getMinutes()) +
        pad(d.getSeconds())
    );
}

function getSuffix(key, min, max) {
    let value = localStorage.getItem(key);

    if (!value) {
        value = String(
            Math.floor(min + Math.random() * (max - min + 1))
        );

        localStorage.setItem(key, value);
    }

    return value;
}

function generateSeries(d) {
    return (
        "QR" +
        String(d.getFullYear()).slice(-2) +
        pad(d.getMonth() + 1) +
        pad(d.getDate()) +
        getSuffix(KEY.seriesSuffix, 100000, 999999)
    );
}

function generateNumber(d) {
    return (
        d.getFullYear() +
        pad(d.getMonth() + 1) +
        pad(d.getDate()) +
        pad(d.getHours()) +
        pad(d.getMinutes()) +
        pad(d.getSeconds()) +
        getSuffix(KEY.numberSuffix, 100, 999)
    );
}

function updateIdentifiers() {
    const s = generateSeries(paymentDate);
    const n = generateNumber(paymentDate);

    series.textContent = s;
    number.textContent = n;

    localStorage.setItem(KEY.series, s);
    localStorage.setItem(KEY.number, n);
}

const savedSeries = localStorage.getItem(KEY.series);
const savedNumber = localStorage.getItem(KEY.number);

if (savedSeries && savedNumber) {
    series.textContent = savedSeries;
    number.textContent = savedNumber;
} else {
    updateIdentifiers();
}

function updateTimer() {
    const now = new Date();

    const diff = Math.max(
        0,
        now.getTime() - paymentDate.getTime()
    );

    const totalSeconds = Math.floor(diff / 1000);

    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    if (hours > 0) {
        timer.textContent =
            pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
    } else {
        timer.textContent =
            pad(minutes) + ":" + pad(seconds);
    }
}

function updateQR() {
    const data = [
        "PROTOTYPE_TICKET",
        "SERIES=" + series.textContent,
        "NUMBER=" + number.textContent,
        "DATE=" + formatQRDate(paymentDate),
        "ROUTE=" + route.textContent,
        "AMOUNT=42",
        "VEHICLE=" + vehicle.textContent
    ].join(";");

    qr.src =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=360x360" +
        "&margin=0" +
        "&data=" +
        encodeURIComponent(data);
}

date.textContent = formatDate(paymentDate);

updateTimer();
updateQR();

setInterval(updateTimer, 1000);

route.addEventListener("click", function() {
    const value = prompt(
        "Введите маршрут:",
        route.textContent
    );

    if (!value || !value.trim()) return;

    route.textContent = value.trim();

    localStorage.setItem(
        KEY.route,
        route.textContent
    );

    updateQR();
});

document
.getElementById("vehicleRow")
.addEventListener("click", function() {

    const value = prompt(
        "Введите номер Т/С:",
        vehicle.textContent
    );

    if (!value || !value.trim()) return;

    vehicle.textContent = value.trim();

    localStorage.setItem(
        KEY.vehicle,
        vehicle.textContent
    );

    updateQR();
});

date.addEventListener("click", function() {

    const value = prompt(
        "Введите дату и время:\nДД.ММ.ГГГГ ЧЧ:ММ",
        formatDate(paymentDate)
    );

    if (!value || !value.trim()) return;

    const match = value.trim().match(
        /^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2})$/
    );

    if (!match) {
        alert(
            "Используйте формат:\nДД.ММ.ГГГГ ЧЧ:ММ"
        );
        return;
    }

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);
    const hours = Number(match[4]);
    const minutes = Number(match[5]);

    const newDate = new Date(
        year,
        month - 1,
        day,
        hours,
        minutes,
        0,
        0
    );

    if (
        isNaN(newDate.getTime()) ||
        newDate.getFullYear() !== year ||
        newDate.getMonth() !== month - 1 ||
        newDate.getDate() !== day
    ) {
        alert("Указана некорректная дата.");
        return;
    }

    paymentDate = newDate;

    localStorage.setItem(
        KEY.payment,
        String(paymentDate.getTime())
    );

    localStorage.removeItem(KEY.series);
    localStorage.removeItem(KEY.number);

    updateIdentifiers();

    date.textContent = formatDate(paymentDate);

    updateTimer();
    updateQR();
});

downloadButton.addEventListener("click", function() {

    paymentDate = new Date();

    localStorage.setItem(
        KEY.payment,
        String(paymentDate.getTime())
    );

    localStorage.setItem(
        KEY.seriesSuffix,
        String(
            Math.floor(
                100000 + Math.random() * 900000
            )
        )
    );

    localStorage.setItem(
        KEY.numberSuffix,
        String(
            Math.floor(
                100 + Math.random() * 900
            )
        )
    );

    localStorage.removeItem(KEY.series);
    localStorage.removeItem(KEY.number);

    date.textContent = formatDate(paymentDate);

    updateIdentifiers();
    updateTimer();
    updateQR();

    if (navigator.vibrate) {
        navigator.vibrate(20);
    }
});
</script>

</body>
</html>
